<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STILLNESS | Massage & Wellness - Servicio a Domicilio Premium</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --primary: #1e2522; /* Grafito orgánico profundo */
            --primary-light: #2c3531;
            --accent: #bfa37a;  /* Oro wellness sutil */
            --accent-light: #f5f2eb; /* Fondo cálido premium */
            --bg-light: #faf9f6; /* Off-white premium */
            --text-main: #2d312e;
            --text-muted: #606662;
            --white: #ffffff;
            --sans: 'Plus Jakarta Sans', sans-serif;
            --serif: 'Cormorant Garamond', serif;
            --transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--sans);
            background-color: var(--bg-light);
            color: var(--text-main);
            line-height: 1.7;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Utilidades de espaciado Premium */
        section {
            padding: 140px 24px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .container-fluid {
            max-width: 100%;
            background-color: var(--white);
        }

        .section-title {
            text-align: center;
            margin-bottom: 80px;
        }

        .section-title span {
            font-family: var(--sans);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--accent);
            display: block;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .section-title h2 {
            font-family: var(--serif);
            font-size: 3rem;
            color: var(--primary);
            font-weight: 400;
            letter-spacing: -0.5px;
        }

        /* Botones Premium */
        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background-color: var(--primary);
            color: var(--white);
            text-decoration: none;
            padding: 18px 36px;
            border-radius: 0;
            font-size: 0.85rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: var(--transition);
            border: 1px solid var(--primary);
            cursor: pointer;
        }

        .btn-primary:hover {
            background-color: transparent;
            color: var(--primary);
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background-color: transparent;
            color: var(--primary);
            text-decoration: none;
            padding: 16px 32px;
            border: 1px solid #d1cbbf;
            font-size: 0.85rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: var(--transition);
        }

        .btn-secondary:hover {
            border-color: var(--primary);
            background-color: rgba(30, 37, 34, 0.02);
        }

        /* Header / Navigation */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            background-color: rgba(250, 249, 246, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(30, 37, 34, 0.04);
            transition: var(--transition);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            text-align: center;
            text-decoration: none;
            color: var(--primary);
        }

        .logo h1 {
            font-family: var(--serif);
            font-size: 1.6rem;
            letter-spacing: 6px;
            font-weight: 400;
            line-height: 1;
        }

        .logo span {
            font-size: 0.6rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--text-muted);
            display: block;
            margin-top: 4px;
        }

        /* Hero Section */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding-top: 140px;
            position: relative;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 60px;
            align-items: center;
            width: 100%;
        }

        .hero-tag {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 24px;
            display: inline-block;
        }

        .hero h2 {
            font-family: var(--serif);
            font-size: 4.5rem;
            line-height: 1.1;
            color: var(--primary);
            font-weight: 400;
            margin-bottom: 32px;
            letter-spacing: -1px;
        }

        .hero p {
            font-size: 1.1rem;
            color: var(--text-muted);
            max-width: 540px;
            margin-bottom: 48px;
        }

        .hero-badges {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            border-top: 1px solid rgba(30, 37, 34, 0.1);
            padding-top: 40px;
            margin-top: 12px;
        }

        .badge-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .badge-item i {
            color: var(--accent);
        }

        .badge-item span {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--primary);
            letter-spacing: 0.5px;
        }

        .hero-image-container {
            position: relative;
            height: 600px;
            background-color: var(--accent-light);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            overflow: hidden;
        }

        .hero-placeholder-art {
            text-align: center;
            color: rgba(30, 37, 34, 0.15);
        }

        .hero-placeholder-art i {
            font-size: 4rem;
            margin-bottom: 16px;
            stroke-width: 0.75;
        }

        /* Servicios */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 40px;
        }

        .service-card {
            background-color: var(--white);
            border: 1px solid rgba(30, 37, 34, 0.05);
            padding: 60px 48px;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .service-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(30, 37, 34, 0.02);
            border-color: rgba(191, 163, 122, 0.3);
        }

        .service-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 24px;
            border-bottom: 1px solid rgba(30, 37, 34, 0.05);
            padding-bottom: 24px;
        }

        .service-header h3 {
            font-family: var(--serif);
            font-size: 2.2rem;
            font-weight: 400;
            color: var(--primary);
            letter-spacing: 0.5px;
        }

        .service-price {
            font-family: var(--sans);
            font-size: 1.2rem;
            font-weight: 500;
            color: var(--accent);
        }

        .service-card p {
            color: var(--text-muted);
            margin-bottom: 32px;
            font-size: 0.95rem;
        }

        .service-actions {
            display: flex;
            gap: 16px;
        }

        /* Modales Elegantes */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(30, 37, 34, 0.4);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background-color: var(--bg-light);
            max-width: 600px;
            width: 90%;
            padding: 48px;
            position: relative;
            transform: translateY(30px);
            transition: var(--transition);
        }

        .modal.active .modal-content {
            transform: translateY(0);
        }

        .modal-close {
            position: absolute;
            top: 24px;
            right: 24px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--primary);
            transition: var(--transition);
        }

        .modal-close:hover {
            color: var(--accent);
        }

        .modal h3 {
            font-family: var(--serif);
            font-size: 2.5rem;
            font-weight: 400;
            margin-bottom: 20px;
        }

        .modal h4 {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent);
            margin: 24px 0 12px 0;
        }

        .modal ul {
            list-style: none;
        }

        .modal ul li {
            font-size: 0.95rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-main);
        }

        .modal ul li i {
            color: var(--accent);
            width: 16px;
        }

        .modal-footer {
            margin-top: 40px;
            border-top: 1px solid rgba(30, 37, 34, 0.08);
            padding-top: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Sobre el Terapeuta */
        .about-grid {
            display: grid;
            grid-template-columns: 0.9fr 1.1fr;
            gap: 80px;
            align-items: center;
        }

        .about-image {
            height: 550px;
            background-color: #eeebe3;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .about-image::after {
            content: '';
            position: absolute;
            top: 20px;
            left: -20px;
            width: 100%;
            height: 100%;
            border: 1px solid #d1cbbf;
            z-index: -1;
        }

        .about-meta h3 {
            font-family: var(--serif);
            font-size: 3.5rem;
            font-weight: 400;
            line-height: 1;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .about-meta .subtitle {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 32px;
            display: block;
        }

        .about-text {
            color: var(--text-muted);
            font-size: 1.05rem;
            margin-bottom: 40px;
            max-width: 540px;
        }

        .specialties-container h4 {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--primary);
            margin-bottom: 20px;
            font-weight: 600;
        }

        .specialties-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .specialty-tag {
            background-color: var(--white);
            border: 1px solid rgba(30, 37, 34, 0.06);
            padding: 10px 20px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--primary);
            transition: var(--transition);
        }

        .specialty-tag:hover {
            border-color: var(--accent);
            background-color: var(--accent-light);
        }

        /* Formación y Certificaciones */
        .certifications {
            background-color: var(--accent-light);
        }

        .cert-intro {
            text-align: center;
            max-width: 650px;
            margin: -40px auto 60px auto;
            color: var(--text-muted);
            font-size: 1rem;
        }

        .cert-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 40px;
            margin-bottom: 60px;
        }

        .cert-card {
            background-color: var(--white);
            padding: 24px;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(30, 37, 34, 0.02);
            transition: var(--transition);
        }

        .cert-card:hover {
            transform: translateY(-4px);
        }

        .cert-img-wrapper {
            width: 100%;
            height: 480px;
            overflow: hidden;
            background-color: #f0f0f0;
            position: relative;
            cursor: pointer;
            border: 1px solid rgba(30, 37, 34, 0.08);
        }

        .cert-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .cert-img-wrapper:hover img {
            transform: scale(1.03);
        }

        .cert-zoom-overlay {
            position: absolute;
            inset: 0;
            background: rgba(30, 37, 34, 0.2);
            opacity: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            transition: var(--transition);
        }

        .cert-img-wrapper:hover .cert-zoom-overlay {
            opacity: 1;
        }

        .cert-info {
            margin-top: 24px;
        }

        .cert-info h3 {
            font-family: var(--serif);
            font-size: 1.6rem;
            font-weight: 400;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .cert-info p {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .cert-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            border-top: 1px solid rgba(30, 37, 34, 0.08);
            padding-top: 40px;
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }

        .stat-box h4 {
            font-family: var(--serif);
            font-size: 3rem;
            font-weight: 400;
            color: var(--primary);
            line-height: 1;
            margin-bottom: 8px;
        }

        .stat-box p {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* Lightbox para imágenes reales */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(30, 37, 34, 0.95);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            padding: 24px;
        }

        .lightbox.active {
            opacity: 1;
            pointer-events: auto;
        }

        .lightbox-img {
            max-width: 90%;
            max-height: 85vh;
            object-fit: contain;
            transform: scale(0.95);
            transition: var(--transition);
        }

        .lightbox.active .lightbox-img {
            transform: scale(1);
        }

        .lightbox-close {
            position: absolute;
            top: 32px;
            right: 32px;
            background: none;
            border: none;
            color: var(--white);
            cursor: pointer;
        }

        /* Qué incluye cada sesión */
        .includes-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 32px;
        }

        .include-card {
            background-color: var(--white);
            padding: 40px;
            border: 1px solid rgba(30, 37, 34, 0.03);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .include-card i {
            color: var(--accent);
            stroke-width: 1.25;
        }

        .include-card h3 {
            font-size: 1.05rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: var(--primary);
        }

        /* Cómo funciona */
        .timeline {
            position: relative;
            max-width: 800px;
            margin: 0 auto;
            padding-left: 40px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            top: 0;
            left: 7px;
            width: 1px;
            height: 100%;
            background-color: rgba(30, 37, 34, 0.1);
        }

        .timeline-item {
            position: relative;
            margin-bottom: 56px;
        }

        .timeline-item:last-child {
            margin-bottom: 0;
        }

        .timeline-dot {
            position: absolute;
            left: -40px;
            top: 6px;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background-color: var(--accent);
            border: 4px solid var(--bg-light);
            z-index: 2;
        }

        .timeline-content span {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent);
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
        }

        .timeline-content h3 {
            font-family: var(--serif);
            font-size: 1.8rem;
            font-weight: 400;
            color: var(--primary);
            margin-bottom: 12px;
        }

        .timeline-content p {
            color: var(--text-muted);
            font-size: 0.95rem;
            max-width: 600px;
        }

        /* Galería */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .gallery-item {
            height: 300px;
            background-color: #eeebe3;
            display: flex;
            align-items: center;
            justify-conte
